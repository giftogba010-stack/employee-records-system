
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #243047;
        }

        header {
            background: #173b70;
            color: white;
            padding: 22px 6%;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .container {
            max-width: 750px;
            width: 90%;
            margin: 40px auto;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(20, 45, 80, 0.08);
            border-top: 5px solid #245db5;
        }

        .profile-card h2 {
            color: #173b70;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .detail {
            padding: 15px 0;
            border-bottom: 1px solid #e5eaf1;
            overflow-wrap: anywhere;
        }

        .detail:last-of-type {
            border-bottom: none;
        }

        .label {
            display: block;
            color: #68758a;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 16px;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            background: #245db5;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #173b70;
        }

        footer {
            text-align: center;
            color: #7a8799;
            padding: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 22px;
            }

            header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Employee Profile</h1>
    </header>

    <main class="container">
        <section class="profile-card">
            <h2>{{ employee.full_name }}</h2>

            <div class="detail">
                <span class="label">Full Name</span>
                <span class="value">{{ employee.full_name }}</span>
            </div>

            <div class="detail">
                <span class="label">Email Address</span>
                <span class="value">{{ employee.email }}</span>
            </div>

            <div class="detail">
                <span class="label">Department</span>
                <span class="value">{{ employee.department }}</span>
            </div>

            <div class="detail">
                <span class="label">Job Title</span>
                <span class="value">{{ employee.job_title }}</span>
            </div>

            <div class="detail">
                <span class="label">Date Created</span>
                <span class="value">{{ employee.date_created|date:"F j, Y" }}</span>
            </div>

            <a class="back-btn" href="{% url 'employee_list' %}">
                ← Back to Dashboard
            </a>
        </section>
    </main>

    <footer>
        Employee Records Management System
    </footer>

</body>
</html>
