
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Employee Records System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #1e3a8a;
            color: white;
            font-size: 27px;
            font-weight: bold;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 9px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #166534;
            border: 1px solid #bbf7d0;
            font-size: 14px;
        }

        .form-fields p {
            margin-bottom: 17px;
        }

        .form-fields label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .form-fields input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-fields input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-fields ul.errorlist {
            color: #dc2626;
            font-size: 13px;
            margin: 6px 0;
            padding-left: 18px;
        }

        .form-fields .helptext {
            display: block;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 6px;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: #1e3a8a;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .register-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748b;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 26px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="register-container">
        <div class="brand">
            <div class="brand-icon">E</div>
            <h1>Create Your Account</h1>
            <p class="subtitle">
                Join the Employee Records System to get started.
            </p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <button type="submit" class="register-button">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Sign in</a>
        </p>

        <p class="footer">
            Employee Records Management System
        </p>
    </main>
</body>
</html>
