
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Employee Account</title>
</head>
<body>
    <h1>Link Login Account</h1>

    <p>Employee: {{ employee.full_name }}</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Account Link</button>
    </form>

    <p>
        <a href="{% url 'employee_list' %}">
            Back to Employee Records
        </a>
    </p>
</body>
</html>
