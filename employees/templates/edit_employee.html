
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | Employee Records System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .top-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .top-link:hover {
            text-decoration: underline;
        }

        h1 {
            margin: 0 0 10px;
            color: #173b70;
            font-size: 30px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
            line-height: 1.6;
        }

        .card {
            padding: 30px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .employee-info {
            padding: 16px;
            margin-bottom: 25px;
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
        }

        .employee-info p {
            margin: 0 0 6px;
            color: #64748b;
            font-size: 13px;
        }

        .employee-info strong {
            color: #173b70;
            font-size: 17px;
        }

        form p {
            margin: 0 0 20px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        form input,
        form select,
        form textarea {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            font-size: 15px;
            font-family: inherit;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .helptext {
            display: block;
            margin-top: 6px;
            color: #64748b;
            font-size: 12px;
        }

        .errorlist {
            color: #b91c1c;
            font-size: 13px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
        }

        .save-button {
            background: #2563eb;
            color: white;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 480px) {
            body {
                padding: 25px 14px;
            }

            .card {
                padding: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <a class="top-link" href="{% url 'employee_list' %}">
            &larr; Back to Employees
        </a>

        <h1>Edit Employee</h1>

        <p class="subtitle">
            Update the employee's information below and save your changes.
        </p>

        <section class="card">

            <div class="employee-info">
                <p>You are editing this employee:</p>
                <strong>{{ employee.full_name }}</strong>
            </div>

            <form method="POST">
                {% csrf_token %}

                {{ form.non_field_errors }}
                {{ form.as_p }}

                <div class="actions">
                    <button type="submit" class="button save-button">
                        Save Changes
                    </button>

                    <a href="{% url 'employee_list' %}"
                       class="button cancel-button">
                        Cancel
                    </a>
                </div>
            </form>

        </section>
    </main>
</body>
</html>
